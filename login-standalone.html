<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Moderno | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --bg: #f3f4f6;
            --text: #1f2937;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9ca3af;
            margin-bottom: 8px;
            margin-left: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            background: rgba(249, 250, 251, 0.5);
            outline: none;
            transition: all 0.3s;
            font-size: 16px;
        }

        .form-group input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(16, 185, 129, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
            transition: all 0.3s;
        }

        .error { color: #ef4444; }
        .success { color: var(--primary); }

        .hint {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }

        /* Decorative circles */
        .circle {
            position: absolute;
            z-index: -1;
            border-radius: 50%;
            filter: blur(60px);
        }
        .circle-1 {
            width: 300px;
            height: 300px;
            background: rgba(16, 185, 129, 0.2);
            top: -100px;
            left: -100px;
        }
        .circle-2 {
            width: 250px;
            height: 250px;
            background: rgba(59, 130, 246, 0.2);
            bottom: -80px;
            right: -80px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        
        <div class="glass-card">
            <div class="header">
                <h1>Bem-vindo</h1>
                <p>Acesse sua conta administrativa</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Usuário</label>
                    <input type="text" id="username" placeholder="Digite seu usuário" required>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn">ENTRAR</button>
            </form>

            <div id="message" class="message"></div>

            <div class="hint">
                Dica: Use <b>admin</b> e <b>123</b>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const msg = document.getElementById('message');

            if (user === 'admin' && pass === '123') {
                msg.innerHTML = 'Login realizado com sucesso! Redirecionando...';
                msg.className = 'message success';
                
                // Simula redirecionamento
                setTimeout(() => {
                    alert('Bem-vindo, Administrador!');
                }, 500);
            } else {
                msg.innerHTML = 'Usuário ou senha incorretos.';
                msg.className = 'message error';
                
                // Animação de erro (shake)
                const card = document.querySelector('.glass-card');
                card.style.animation = 'none';
                setTimeout(() => {
                    card.style.animation = 'shake 0.4s';
                }, 10);
            }
        });

        // Adiciona animação de shake via CSS dinâmico
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
